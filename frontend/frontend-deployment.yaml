apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 936506757750.dkr.ecr.eu-north-1.amazonaws.com/frontend-app:latest
        ports:
        - containerPort: 80
